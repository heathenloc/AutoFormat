<div id="app"><main style="padding:40px"><h1>AutoFormat</h1><p>正在打开交互原型…</p><noscript>交互体验需要启用 JavaScript。墨刀导入可使用同目录的 modao-import.html。</noscript></main></div>
<dialog id="dialog" class="modal" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
'use strict';
const KEY='autoformat-prototype-v1';
const $=s=>document.querySelector(s);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const icons={file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',history:'<path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/>',report:'<path d="M8 3H5v18h14V3h-3M8 3h8v4H8zM8 12h8M8 16h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',branch:'<circle cx="6" cy="4" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="20" r="2"/><path d="M6 6v12M6 14h6a6 6 0 0 0 6-5"/>',type:'<path d="M4 7V4h16v3M12 4v16m-4 0h8"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>'};
const icon=n=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.file)+'</svg>';
const anchors=[
 {id:'h1',role:'heading1',text:'第1章 绪论'},
 {id:'h2a',role:'heading2',text:'1.1 研究背景'},
 {id:'p1',role:'body',text:'随着数字化工具在学术写作中的应用，文档的结构与呈现方式逐渐受到关注。清晰的层级、统一的排版，有助于读者理解研究思路，也为后续的审阅与交流提供便利。'},
 {id:'p2',role:'body',text:'本研究围绕学术文档的格式处理展开讨论，关注格式要求的识别、修改依据的追溯，以及用户在处理过程中的决策方式。研究内容在格式调整过程中保持不变。'},
 {id:'h2b',role:'heading2',text:'1.2 研究方法'},
 {id:'p3',role:'body',text:'研究采用文档分析与流程观察相结合的方法，将格式要求整理为具有明确对象、属性和作用范围的规则。在每次调整后保留独立版本，以便核对修改前后的差异。'}
];
const baseRules=[
 ['正文中文字体','宋体','Brief §2，第3段','“正文中文采用宋体。”'],
 ['正文西文字体','Times New Roman','Brief §2，第3段','“字母与数字使用 Times New Roman。”'],
 ['正文字号','小四 · 12 pt','Brief §2，第3段','“正文采用小四号字。”'],
 ['正文行距','1.5 倍','Brief §2，第4段','“正文采用1.5倍行距。”'],
 ['首行缩进','2 字符','Brief §2，第4段','“正文首行缩进2字符。”'],
 ['一级标题字体','黑体','Brief §3，第1段','“一级标题为黑体、小三号、加粗。”'],
 ['一级标题字号','小三 · 15 pt','Brief §3，第1段','“一级标题为黑体、小三号、加粗。”'],
 ['一级标题字形','加粗','Brief §3，第1段','“一级标题为黑体、小三号、加粗。”'],
 ['二级标题字号','四号 · 14 pt','Brief §3，第2段','“二级标题为四号字、加粗、左对齐。”'],
 ['二级标题字形','加粗','Brief §3，第2段','“二级标题为四号字、加粗、左对齐。”'],
 ['二级标题对齐','左对齐','Brief §3，第2段','“二级标题为四号字、加粗、左对齐。”'],
 ['表格边框','三线表','Brief §4，第1段','“表格使用三线表，保留原始数据。”']
];
const originalStyles={h1:{align:'left',size:15,bold:true},h2a:{align:'left',size:13,bold:true},h2b:{align:'left',size:13,bold:true},p1:{align:'left',size:12,bold:false},p2:{align:'left',size:12,bold:false},p3:{align:'left',size:12,bold:false}};
function fresh(){return {schema:1,files:{brief:null,paper:null},scenario:'review',stage:'upload',decisions:{alignment:null,page:null},versions:[{id:0,parent:null,created:new Date().toISOString(),summary:'论文原稿 · 始终保留',styles:clone(originalStyles),decisions:{},rules:[],events:[],initial:true}],active:0,viewed:0,next:1};}
let state=fresh(),route='upload',selection=null,plan=null,scopeApproved=false,zoom=100,reportFilter='all',processIndex=0,processKind='parse',processing=false,processRun=0,processOrigin=null,toastTimer;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.schema===1&&Array.isArray(saved.versions)&&saved.versions.length&&saved.versions.every(v=>Number.isInteger(v.id)&&v.styles&&Array.isArray(v.events))&&saved.versions.some(v=>v.id===saved.active)&&Number.isInteger(saved.next)&&saved.decisions&&saved.files){state=saved;if(state.stage==='processing')state.stage='upload';}}catch{}
const version=(id=state.viewed)=>state.versions.find(v=>v.id===Number(id))||state.versions[0];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
function time(s){return new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});}
function decisionDone(d){return !!d&&['answered','skip'].includes(d.status);}
function reviewReady(){return state.scenario==='clear'||Object.values(state.decisions).every(decisionDone);}
function routeAllowed(r){if(['workspace','history','report'].includes(r))return state.versions.length>1;if(r==='review')return state.stage==='review'||state.versions.length>1;return true;}
function go(r){if(processing){toast('请等待当前步骤完成，或先取消处理。');return;}if(!routeAllowed(r)){toast('先上传两份文件并完成要求确认。');return;}if(route==='workspace')readDraft();route=r;selection=null;plan=null;zoom=100;history.replaceState(null,'','#'+r);render();window.scrollTo({top:0});}
function nav(){const links=[['upload','upload','新建任务'],['review','check','格式要求'],['workspace','eye','预览与微调'],['history','history','版本历史'],['report','report','修改报告']];return links.map(([r,i,t])=>'<a href="#'+r+'" data-route="'+r+'" class="'+(route===r?'active':'')+'"'+(route===r?' aria-current="page"':'')+(!routeAllowed(r)?' aria-disabled="true"':'')+'>'+icon(i)+'<span>'+t+'</span>'+(r==='history'&&state.versions.length>1?'<span class="nav-count">'+state.versions.length+'</span>':'')+'</a>').join('');}
function shell(body){return '<div class="shell"><header class="topbar"><div class="topbar-inner"><a class="brand" href="#upload" data-route="upload" aria-label="AutoFormat 首页"><span class="brand-mark">A</span>AutoFormat</a><nav class="primary-nav" aria-label="顶部导航"><div class="workspace-dropdown"><button class="workspace-trigger" id="workspace-trigger" data-action="toggle-workspace" aria-expanded="false" aria-controls="workspace-menu">论文空间<span class="nav-chevron" aria-hidden="true"></span></button><div class="workspace-menu" id="workspace-menu" hidden><nav class="nav" aria-label="论文空间">'+nav()+'<div class="nav-divider" role="separator"></div><button class="nav-reset" data-action="reset">'+icon('history')+'<span>重新开始</span></button></nav></div></div></nav><div class="top-actions"><button class="text-button" data-action="help">体验指南</button><a class="top-link" href="../index.html">'+icon('back')+'返回产品介绍</a><button class="avatar" data-action="visitor" aria-label="访客">访</button></div></div></header><main id="main" class="content" tabindex="-1"><p class="demo-note"><span class="dot"></span>交互原型 · 使用内置示例体验，所选文件不会上传或被实际处理</p>'+body+'</main></div>';}
function setWorkspaceOpen(open,focus=false){const trigger=$('#workspace-trigger'),menu=$('#workspace-menu');if(!trigger||!menu)return;trigger.setAttribute('aria-expanded',String(open));menu.hidden=!open;if(focus)trigger.focus();}
function steps(n){return '<div class="steps" aria-label="处理步骤">'+['上传文件','解析要求','确认疑问','预览与微调'].map((t,i)=>(i?'<span class="step-line" aria-hidden="true"></span>':'')+'<span class="step '+(i===n?'active':i<n?'done':'')+'"><span class="step-number">'+(i<n?'✓':i+1)+'</span>'+t+'</span>').join('')+'</div>';}
function upload(){const f=(kind,title,formats)=>'<section class="card upload-card"><div class="section-line"><h2>'+title+'</h2><span class="chip">必需</span></div><input class="file-input" type="file" id="file-'+kind+'" data-file="'+kind+'" accept="'+(kind==='brief'?'.docx,.pdf,.txt':'.docx')+'"><label class="upload-zone" for="file-'+kind+'" data-drop="'+kind+'">'+icon(state.files[kind]?'file':'upload')+'<strong>'+escape(state.files[kind]?.name||(kind==='brief'?'选择学校 Brief 或格式模板':'选择论文原稿'))+'</strong><p>'+(state.files[kind]?'已选择 · 点击可更换':'点击选择，或将文件拖到这里')+'<br>'+formats+'</p></label><div class="file-meta"><span>'+(kind==='brief'?'用于提取要求与原文依据':'原稿记为 V0，后续调整另存副本')+'</span>'+(state.files[kind]?'<button class="text-button" data-action="remove-file" data-kind="'+kind+'">移除</button>':'')+'</div><p id="error-'+kind+'" class="error-text" role="alert"></p></section>';
return '<div class="page-heading"><div><h1>上传格式要求和原文</h1></div></div>'+steps(0)+'<div class="two-col">'+f('brief','格式要求','DOCX · 文本型 PDF · TXT')+f('paper','论文原稿','仅支持 DOCX')+'</div><div class="upload-actions row between"><p class="small">示例论文与 Brief 为虚构材料，用于展示完整交互流程。</p><div class="row"><button class="btn" data-action="sample">自动填充文件</button><button class="btn primary" data-action="parse" '+(!state.files.brief||!state.files.paper?'disabled':'')+'>解析格式要求 '+icon('arrow')+'</button></div></div>';}
function processScreen(){const labels=processKind==='parse'?['检查文件与保留原稿 V0','提取格式要求与原文依据','识别冲突与模板观察','整理编辑前待确认项']:['建立已确认规则与修改计划','在父版本副本上调整格式','核对正文与目标格式属性','生成独立版本、报告与预览'];return '<div class="page-heading"><div><p class="eyebrow">'+(processKind==='parse'?'READING THE REQUIREMENTS.':'A NEW VERSION, SAFELY.')+'</p><h1>'+(processKind==='parse'?'正在梳理这份格式要求。':'正在准备一份新的论文副本。')+'</h1></div></div>'+steps(processKind==='parse'?1:3)+'<section class="card processing"><div class="processing-orb">'+icon(processKind==='parse'?'file':'spark')+'</div><h2 class="processing-title">'+(processKind==='parse'?'从原文，找到清楚的依据。':'每一次调整，都可回溯。')+'</h2><p class="processing-sub">'+escape(state.files.paper?.name||'示例论文.docx')+'<br>正在演示处理流程，原稿与既有版本保持不变。</p><div class="progress-track" role="progressbar" aria-label="处理进度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="'+processIndex+'"><span style="width:'+Math.max(8,processIndex*25)+'%"></span></div>'+labels.map((t,i)=>'<div class="process-row '+(i===processIndex?'current':'')+'">'+(i<processIndex?icon('check'):i===processIndex?'<span class="spinner" aria-hidden="true"></span>':icon('file'))+'<span>'+t+'</span><small>'+(i<processIndex?'已完成':i===processIndex?'处理中':'等待中')+'</small></div>').join('')+'<div class="processing-footer"><button class="btn quiet compact" data-action="cancel-process">取消本次处理</button></div></section>';}
function question(key,title,explanation,evidence,options,locked){const d=state.decisions[key],done=decisionDone(d),readOnly=state.active>0;return '<section class="card question-card '+(locked?'locked':'')+'" data-question="'+key+'"><div class="question-title"><h2 id="question-'+key+'-title">'+title+'</h2><span class="chip '+(done?'teal':key==='alignment'?'amber':'')+'">'+(done?d.status==='skip'?'已明确忽略':'已确认':key==='alignment'?'规则冲突':'模板观察')+'</span></div><p>'+explanation+'</p>'+evidence+'<fieldset aria-labelledby="question-'+key+'-title" '+(locked||readOnly?'disabled':'')+'>'+(locked?'<p class="small" style="margin-top:15px">先完成上方冲突项，再确认模板属性</p>':'')+'<div class="choices">'+options.map(([value,label,sub])=>'<label class="choice"><input type="radio" name="'+key+'" value="'+value+'" '+(d?.status==='answered'&&d.value===value?'checked':'')+'><span>'+label+'<small>'+sub+'</small></span></label>').join('')+'</div></fieldset>'+(done?'<div class="decision-result" role="status">'+(d.status==='skip'?'此项保持原稿格式，作为忽略项留在报告中。':'已选择：'+escape(options.find(o=>o[0]===d.value)?.[1]))+'</div>':'')+(!readOnly?'<div class="row" style="margin-top:12px"><button class="btn compact quiet" data-action="skip-decision" data-key="'+key+'" aria-pressed="'+(d?.status==='skip')+'" '+(locked?'disabled':'')+'>暂时忽略此项</button></div>':'')+'</section>';}
function chooseDecision(key,value){const allowed={alignment:['center','left'],page:['template','keep']};if(route!=='review'||state.stage!=='review'||state.active!==0||processing||!allowed[key]?.includes(value)||key==='page'&&!decisionDone(state.decisions.alignment))return;state.decisions[key]={status:'answered',value,source:'用户编辑前确认'};persist();render();$('input[name="'+key+'"][value="'+value+'"]').focus({preventScroll:true});}
function review(){const done=Object.values(state.decisions).filter(decisionDone).length;return '<div class="page-heading"><div><h1>选择需要执行的修改</h1></div></div>'+steps(2)+'<div class="review-layout"><div>'+question('alignment','01 · 一级标题应该如何对齐？','要求出现冲突，选择一项进行修改','<div class="evidence"><small>示例 Brief · §3 第1段</small>“一级标题居中，小三号，黑体加粗。”</div><div class="evidence"><small>示例 Brief · 附件 A 第2段</small>“章标题统一左对齐。”</div>',[['center','采用居中','依据 Brief §3 第1段，作用于一级标题。'],['left','采用左对齐','依据附件 A 第2段，作用于一级标题。']],false)+question('page','02 · 是否沿用模板中的页面版式？','示例自带的模板或页面设置（观察值），不代表明文要求','<div class="evidence">A4 · 纵向 · 四边页边距 2.5 cm</div>',[['template','沿用列出的模板版式','将以上观察值作为本次任务中你确认的要求。'],['keep','保留论文原稿的页面版式','本次不为这些属性新增格式规则。']],!decisionDone(state.decisions.alignment))+'</div><aside class="card summary-card"><p class="panel-eyebrow">REQUIREMENT REVIEW</p><h2>确认进度</h2><div class="summary-metric"><strong>'+done+'</strong><span class="small">/ 2 项已处理</span></div><div class="progress-track"><span style="width:'+done*50+'%"></span></div><div class="summary-list"><div><span>已验证的明文规则</span><strong>12 项</strong></div><div><span>待确认项</span><strong>'+(2-done)+' 项</strong></div><div><span>仅报告／待复核</span><strong>2 项</strong></div></div><button class="btn primary" data-action="generate" '+(!reviewReady()?'disabled':'')+'>开始修改 '+icon('arrow')+'</button></aside></div><div class="review-footer"><button class="text-button" data-action="view-rules">查看全部修改项</button></div>';}
function paper(v){const s=v.styles;const line=a=>{const st=s[a.id]||originalStyles[a.id],tag=a.role==='heading1'?'h1':a.role==='heading2'?'h2':'p';return '<'+tag+' tabindex="0" data-anchor="'+a.id+'" data-role="'+a.role+'" style="text-align:'+st.align+';font-size:'+st.size+'pt;font-weight:'+(st.bold?'700':'400')+'">'+escape(a.text)+'</'+tag+'>';};return '<article class="paper '+(v.id===0?'before':'')+'" id="paper" aria-label="可选择文字的示例论文预览"><div class="paper-header"><span>学术文档格式处理研究 · 示例论文</span><span>'+('V'+v.id)+'</span></div>'+anchors.map(a=>line(a)).join('')+'<table><caption>表 1-1 · 研究流程（虚构示例）</caption><thead><tr><th>阶段</th><th>主要工作</th><th>输出</th></tr></thead><tbody><tr><td>要求识别</td><td>梳理明文与来源</td><td>格式规则</td></tr><tr><td>格式调整</td><td>修改与复核</td><td>独立版本</td></tr></tbody></table><p style="font-size:10px;text-indent:0">注：本文及表格为交互原型自编的虚构示例，不作为真实研究结论。</p><div class="paper-footer">— 1 —</div></article>';}
function versionSelect(){return '<select id="version-select" class="version-select" aria-label="选择查看版本">'+state.versions.map(v=>'<option value="'+v.id+'" '+(v.id===state.viewed?'selected':'')+'>V'+v.id+(v.id===0?' · 原稿':v.id===state.active?' · 工作起点':' · 历史版本')+'</option>').join('')+'</select>';}
let draftText='',draftScope='selection';
function workspace(){const v=version(),historical=v.id!==state.active,original=v.id===0;return '<div class="page-heading workspace-heading"><div><h1>预览修改结果</h1><p>'+escape(v.inputFiles?.paper?.name||state.files.paper?.name||'示例论文.docx')+' <span aria-hidden="true">·</span> V'+v.id+(v.parent!==null?' ← V'+v.parent:' · 原稿')+'</p></div><div class="row">'+versionSelect()+'<button class="btn primary" data-action="downloads">'+icon('download')+'下载示例文件</button></div></div>'+(historical?'<div class="notice">'+icon('history')+'<div>正在查看历史版本 V'+v.id+'。'+(original?'如需从原稿重新处理，请在版本历史中选择「从原稿重新确认」。':'返回此版本继续修改后，新版本将以它为父版本。')+'</div>'+(!original?'<button class="btn compact" data-action="continue" data-id="'+v.id+'">返回此版本继续修改</button>':'')+'</div>':'<div class="notice good">'+icon('check')+'<div>V'+v.id+' 已就绪。当前工作起点为 V'+state.active+'，可选中文字提出微调需求。</div></div>')+'<div class="workspace-layout"><section class="preview-shell"><div class="preview-toolbar"><span>论文预览 · 1 / 1 页</span><div class="row"><button class="btn compact quiet" data-action="zoom-out" aria-label="缩小预览">'+icon('minus')+'</button><span class="zoom-label" id="zoom-label">100%</span><button class="btn compact quiet" data-action="zoom-in" aria-label="放大预览">'+icon('plus')+'</button></div></div><div class="preview-scroll">'+paper(v)+'</div><div class="preview-hint"><span>'+icon('type')+' 拖选文字，或点击一个段落来体验微调</span><span>示例 HTML 预览 · 与 Word 分页可能不同</span></div></section><aside><section class="card feedback-panel"><p class="panel-eyebrow">A SMALL CHANGE, A NEW VERSION.</p><h2 class="panel-title">选择局部修改的内容</h2><div class="selection-box" id="selection-box"><span class="small">尚未选择文字</span>在左侧预览中选择一处内容。</div><label class="field-label" for="feedback-text">你的修改需求</label><textarea id="feedback-text" class="textarea" placeholder="例如：这里改成左对齐" '+(historical||original?'disabled':'')+'>'+escape(draftText)+'</textarea><div class="examples"><button class="example" data-example="这里改成左对齐">改成左对齐</button><button class="example" data-example="选中文字加粗">选中文字加粗</button><button class="example" data-example="字号改为14磅">字号改为14磅</button></div><label class="field-label" for="feedback-scope">希望修改的范围</label><select id="feedback-scope" class="select" '+(historical||original?'disabled':'')+'>'+[['selection','仅选中文字'],['paragraph','所在段落'],['same_kind','所有同类内容'],['document','全文']].map(([k,t])=>'<option value="'+k+'" '+(draftScope===k?'selected':'')+'>'+t+'</option>').join('')+'</select><p class="small" style="margin-top:8px">对齐等段落属性会先显示实际作用范围。</p><button class="btn primary" id="analyze-button" data-action="analyze" disabled>检查这条修改 '+icon('arrow')+'</button><div id="feedback-result" aria-live="polite"></div></section><section class="card report-short"><div class="row"><h3>此版本修改记录</h3><span class="chip teal">V'+v.id+'</span></div><p>'+v.rules.filter(r=>r.status==='applied').length+' 项规则已用于示例排版。'+v.rules.filter(r=>r.status==='ignored').length+' 项明确忽略，2 项需人工查看或复核。</p><button class="btn compact" data-route="report">查看完整报告 '+icon('arrow')+'</button></section></aside></div>';}
function historyScreen(){return '<div class="page-heading"><div><h1>查看历史版本</h1></div><span class="chip teal">工作起点 V'+state.active+'</span></div><div class="note-box" style="margin-bottom:22px">'+icon('branch')+' 版本号按创建顺序递增；箭头表示父版本。例如 V3 ← V1 表示从 V1 创建的新分支。</div><div class="history-list">'+[...state.versions].reverse().map(v=>'<article class="card version-card '+(v.id===state.active?'current':'')+'"><span class="version-badge">V'+v.id+'</span><div><div class="row"><h2>'+escape(v.id===0?'论文原稿（不可编辑）':v.summary)+'</h2>'+(v.id===state.active?'<span class="chip teal">工作起点</span>':'')+(v.id===0?'<span class="chip">不可变原稿</span>':'')+'</div>'+(v.id===0||v.initial?'':'<p>父版本 V'+v.parent+' · '+escape(v.events.at(-1)?.description||'')+'</p>')+'<div class="version-meta"><span>'+time(v.created)+'</span><span>'+(v.id===0?'未进行格式修改':v.events.length+' 条微调记录 · '+Object.values(v.decisions).filter(d=>d?.status==='skip').length+' 项忽略')+'</span></div></div><div class="version-actions"><button class="btn compact" data-action="view-version" data-id="'+v.id+'">查看这一版</button>'+(v.id===0?'<button class="btn compact quiet" data-action="restart-original">从原稿重新确认</button>':'<button class="btn compact '+(v.id===state.active?'quiet':'primary')+'" data-action="continue" data-id="'+v.id+'" '+(v.id===state.active?'disabled':'')+'>返回此版本继续修改</button>')+'</div></article>').join('')+'</div>';}
function report(){const v=version(),rows=v.rules.filter(r=>reportFilter==='all'||r.status===reportFilter);const count=k=>v.rules.filter(r=>r.status===k).length;return '<div class="page-heading"><div><h1>本次修改项</h1></div><div class="row report-actions">'+versionSelect()+'<button class="btn primary" data-action="download-report">'+icon('download')+'下载报告</button><a class="btn" href="#workspace" data-route="workspace">'+icon('back')+'返回预览</a></div></div><div class="report-stats">'+[[count('applied'),'用于示例排版'],[count('ignored'),'已明确忽略'],[count('manual'),'待人工复核'],[count('unsupported'),'仅报告，不执行']].map(([n,t])=>'<div class="card stat"><strong>'+n+'</strong><span>'+t+'</span></div>').join('')+'</div><div class="filter-row" aria-label="报告状态筛选">'+[['all','全部'],['applied','已应用'],['ignored','已忽略'],['manual','待复核'],['unsupported','仅报告']].map(([k,t])=>'<button class="filter" data-filter="'+k+'" aria-pressed="'+(reportFilter===k)+'">'+t+'</button>').join('')+'</div><section class="card report-table-wrap"><table class="report-table"><thead><tr><th>格式对象／属性</th><th>本版处理结果与依据</th><th>状态</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><strong>'+escape(r.name)+'</strong></td><td>'+escape(r.value)+'<details class="evidence-details"><summary>'+escape(r.source)+'</summary>'+escape(r.quote)+'</details></td><td><span class="chip '+(r.status==='applied'?'teal':r.status==='manual'?'amber':'')+'">'+({applied:'示例已应用',ignored:'明确忽略',manual:'待人工复核',unsupported:'仅报告'})[r.status]+'</span></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">当前筛选下没有项目。</div>')+'</section>'+(v.events.length?'<section class="card card-pad" style="margin-top:20px"><h2>截至这一版的微调记录</h2>'+v.events.map(e=>'<div class="evidence"><small>'+escape(e.source)+' · '+escape(e.policyLabel)+'</small>'+escape(e.description)+'<br><span class="small">用户原话：'+escape(e.raw)+'</span></div>').join('')+'</section>':'')+'<div class="notice">'+icon('info')+'<div>目录与页码需要在 Word 中刷新并复核。预览可见不代表下载 DOCX 的字段已完成验证。</div></div>';}
function failure(){return '<div class="page-heading"><div><p class="eyebrow">LET’S TRY THAT AGAIN.</p><h1>这次解析没有完成。</h1></div></div>'+steps(1)+'<section class="card processing"><div class="processing-orb error-illustration">'+icon('info')+'</div><h2 class="processing-title">暂时无法取得完整格式要求</h2><p class="processing-sub">这是解析失败的演示场景。没有生成新版本，原稿与历史仍然保留。</p><div class="notice">'+icon('file')+'<div>可能是文件缺少可提取文字，或解析服务暂时不可用。可重试或更换 Brief。</div></div><div class="row" style="justify-content:center"><button class="btn" data-route="upload">返回更换文件</button><button class="btn primary" data-action="retry">重新解析 '+icon('arrow')+'</button></div></section>';}
function render(){const screens={upload,processing:processScreen,review,workspace,history:historyScreen,report,error:failure};$('#app').innerHTML=shell((screens[route]||upload)());document.title='AutoFormat · '+({upload:'新建任务',review:'编辑前确认',workspace:'预览与微调',history:'版本历史',report:'修改报告',processing:'处理中',error:'解析失败'})[route];if(route==='workspace')updateSelection();if(route==='review'&&state.active>0){$('.page-heading h1').textContent='确认格式要求';const b=$('[data-action=generate]');b.removeAttribute('data-action');b.dataset.route='workspace';b.disabled=false;b.textContent='返回预览';if(version(state.active).noQuestions){$('.page-heading h1').textContent='要求清楚，已直接生成初稿。';$('.review-layout>div').innerHTML='<section class="card card-pad"><h2>无需额外确认</h2><p class="small" style="margin-top:15px">来源、值和适用范围均清楚的规则直接执行；未规定的页面属性保留原稿。</p></section>';$('.summary-metric').innerHTML='<strong>0</strong><span class="small">项待确认</span>';}}}
function modal(title,body,actions=''){const d=$('#dialog');d.innerHTML='<div class="modal-inner"><div class="modal-header"><h2 id="dialog-title">'+title+'</h2><button class="close" data-action="close-dialog" aria-label="关闭弹窗">'+icon('close')+'</button></div>'+body+(actions?'<div class="modal-actions">'+actions+'</div>':'')+'</div>';if(!d.open)d.showModal();}
function close(){if($('#dialog').open)$('#dialog').close();}
function sample(){state.files={brief:{name:'毕业论文格式要求（示例）.docx'},paper:{name:'学术文档格式处理研究（示例）.docx'}};persist();render();toast('已填入示例文件。可以开始解析格式要求。');}
function handleFile(kind,file){if(!file)return;const valid=kind==='brief'?/\.(docx|pdf|txt)$/i.test(file.name):/\.docx$/i.test(file.name);if(!valid){const e=$('#error-'+kind);if(e)e.textContent=kind==='brief'?'Brief 支持 DOCX、文本型 PDF 或 TXT，请重新选择。':'论文原稿仅支持 DOCX，请重新选择。';toast('文件类型不支持，请重新选择。');return;}state.files[kind]={name:file.name};persist();render();toast('已记录文件名；原型仍使用内置示例，不读取文件内容。');}
async function runProcess(kind,callback){processOrigin={route,stage:state.stage};processing=true;processKind=kind;processIndex=0;const run=++processRun;route='processing';state.stage='processing';persist();render();window.scrollTo({top:0});for(let i=0;i<4;i++){await new Promise(r=>setTimeout(r,540));if(run!==processRun)return;processIndex=i+1;render();}processing=false;callback();}
function beginParse(){if(!state.files.brief||!state.files.paper)return;if(!state.versions[0].inputFiles)state.versions[0].inputFiles=clone(state.files);state.decisions={alignment:null,page:null};runProcess('parse',()=>{if(state.scenario==='failure'){state.stage='error';route='error';persist();render();return;}state.stage='review';route='review';if(state.scenario==='clear'){state.decisions={alignment:{status:'answered',value:'center',source:'明文要求，无冲突场景'},page:{status:'answered',value:'keep',source:'原稿属性未被要求修改'}};generate();}else{persist();render();}});}
function initialRules(decisions){const rules=baseRules.map(([name,value,source,quote])=>({name,value,source,quote,status:'applied'}));const a=decisions.alignment,p=decisions.page;rules.push({name:'一级标题对齐',value:a?.status==='skip'?'保持原稿，未新增对齐规则':a?.value==='center'?'居中':'左对齐',source:a?.source||'用户编辑前决定',quote:a?.source==='明文要求，无冲突场景'?'“一级标题居中，小三号，黑体加粗。”此场景没有附件冲突。':'Brief §3“一级标题居中”；附件 A“章标题统一左对齐”。用户明确决定本次采用的依据。',status:a?.status==='skip'?'ignored':'applied'});if(p?.status==='skip')rules.push({name:'页面版式',value:'保持原稿，未采用模板观察值',source:'用户明确暂时忽略',quote:'A4、纵向、四边2.5cm仅为模板观察。',status:'ignored'});else if(p?.value==='template')rules.push({name:'页面版式',value:'A4、纵向、四边页边距 2.5 cm',source:'用户确认的模板观察',quote:'Brief 自带模板页面设置；原文没有明文规定这些属性。',status:'applied'});rules.push({name:'目录与页码字段',value:'需要在 Word 中刷新并核对；本原型未验证字段缓存',source:'示例交付复核项',quote:'属性写入与分页、字段缓存验证是不同的步骤。',status:'manual'},{name:'图片分辨率',value:'原型不执行图片本体修改，保留人工处理说明',source:'示例 Brief §5',quote:'“图片分辨率不低于300dpi。”图片本体不在首版自动编辑范围。',status:'unsupported'});return rules;}
function reviewItems(){if(state.active>0)return clone(version(state.active).rules);const items=baseRules.map(([name,value,source,quote])=>({name,value,source,quote,status:'ready'}));const a=state.decisions.alignment,p=state.decisions.page;items.push({name:'一级标题对齐',value:!decisionDone(a)?'待选择居中或左对齐':a.status==='skip'?'保持原稿，未新增对齐规则':a.value==='center'?'居中':'左对齐',source:decisionDone(a)?a.status==='skip'?'用户明确暂时忽略':'用户编辑前确认':'冲突待确认',quote:'Brief §3“一级标题居中”；附件 A“章标题统一左对齐”。',status:!decisionDone(a)?'pending':a.status==='skip'?'ignored':'ready'},{name:'页面版式',value:!decisionDone(p)?'待选择是否使用模板中的格式':p.status==='skip'?'保持原稿，未采用模板观察值':p.value==='template'?'A4、纵向、四边页边距 2.5 cm':'保留论文原稿的页面版式',source:!decisionDone(p)?'模板观察，待确认':p.status==='skip'?'用户明确暂时忽略':p.value==='template'?'用户确认的模板观察':'用户选择保留原稿',quote:'Brief 自带模板页面设置；此项未明确规定。',status:!decisionDone(p)?'pending':p.status==='skip'?'ignored':p.value==='keep'?'kept':'ready'});return items.concat(initialRules(state.decisions).filter(r=>['manual','unsupported'].includes(r.status)));}
function showReviewItems(){const labels={ready:'待应用',pending:'待确认',ignored:'已忽略',kept:'保留原格式',manual:'待复核',unsupported:'暂不支持',applied:'已修改'};modal('全部修改项',reviewItems().map(r=>'<section class="evidence" data-review-item data-status="'+r.status+'"><div class="row between"><strong>'+escape(r.name)+'</strong><span class="chip '+(['ready','applied'].includes(r.status)?'teal':['pending','manual','unsupported'].includes(r.status)?'amber':'')+'">'+labels[r.status]+'</span></div><p>'+escape(r.value)+'</p><small>'+escape(r.source)+'</small><span class="small">'+escape(r.quote)+'</span></section>').join(''));}

function generate(){if(state.stage!=='review'||state.active!==0||!reviewReady()){toast('请完成所有待确认项，或逐项明确暂时忽略。');return;}const parent=version(state.active);runProcess('edit',()=>{const styles=clone(originalStyles);for(const a of anchors){styles[a.id].size=a.role==='heading1'?15:a.role==='heading2'?14:12;styles[a.id].align=a.role==='body'?'justify':'left';}if(state.decisions.alignment?.status==='answered')styles.h1.align=state.decisions.alignment.value;const id=state.next++;state.versions.push({id,parent:parent.id,created:new Date().toISOString(),summary:id===1?'首次排版副本':'从原稿重新确认的排版副本',inputFiles:clone(parent.inputFiles||state.files),styles,decisions:clone(state.decisions),rules:initialRules(state.decisions),events:[],initial:true,noQuestions:state.scenario==='clear'});state.active=id;state.viewed=id;state.stage='ready';draftText='';selection=null;plan=null;persist();route='workspace';history.replaceState(null,'','#workspace');render();toast('V'+id+' 已生成，原稿和历史版本已保留。');});}
function readDraft(){if($('#feedback-text'))draftText=$('#feedback-text').value;if($('#feedback-scope'))draftScope=$('#feedback-scope').value;}
function chooseSelection(id,text){if(!anchors.some(a=>a.id===id))return;selection={id,text:text||anchors.find(a=>a.id===id).text};plan=null;scopeApproved=false;updateSelection();}
function updateSelection(){if(!$('#selection-box'))return;document.querySelectorAll('.selected-anchor').forEach(e=>e.classList.remove('selected-anchor'));if(selection){$('#selection-box').innerHTML='<span class="small">已选择 · '+({heading1:'一级标题',heading2:'二级标题',body:'正文段落'})[anchors.find(a=>a.id===selection.id).role]+'</span>'+escape(selection.text);$('[data-anchor="'+selection.id+'"]').classList.add('selected-anchor');}else $('#selection-box').innerHTML='<span class="small">尚未选择文字</span>在左侧预览中选择一处内容。';$('#analyze-button').disabled=!selection||version().id!==state.active||state.viewed===0;$('#feedback-result').innerHTML='';}
function supportedFeedback(text){const t=text.replace(/\s/g,'').replace(/[。！!]$/,'').replace(/^(?:请)?(?:这里|这段|此处|所在段落|选中(?:的)?(?:文字|内容)|所有(?:一级标题|二级标题|同类内容|正文(?:段落)?)|全文|全部)?(?:的)?/,'');return /^(?:对齐方式)?(?:改为|改成|设为|设置为)?(?:左对齐|居中|两端对齐)$/.test(t)||/^(?:字号)?(?:改为|改成|设为|设置为)?\d+(?:\.\d+)?(?:磅|pt)$/i.test(t)||/^(?:改为|设为)?加粗$/.test(t);}
function analyze(){readDraft();if(!selection||state.viewed!==state.active||state.viewed===0)return;const text=draftText.trim(),out=$('#feedback-result');plan=null;scopeApproved=false;const err=t=>{out.innerHTML='<div class="notice">'+icon('info')+'<span>'+escape(t)+'</span></div>';};if(!text){err('请先写下希望调整的格式。');return;}const alignmentMatches=[['左对齐','left'],['居中','center'],['两端对齐','justify']].filter(([k])=>text.includes(k));const sizes=text.match(/(?:字号|改为|改成)\s*(\d+(?:\.\d+)?)\s*(?:磅|pt)/i);const bold=text.includes('加粗')&&!text.includes('取消加粗');const recognized=alignmentMatches.length+(sizes?1:0)+(bold?1:0);const negative=/不要|别|不改|取消|不需要|不用|保持/.test(text)||!supportedFeedback(text);if(negative||recognized!==1){err('请一次描述一个明确的格式属性，例如“这里改成左对齐”或“字号改为14磅”。这条需求尚未执行。');return;}if(sizes&&(Number(sizes[1])<5||Number(sizes[1])>72)){err('示例支持 5–72 磅字号，请填写范围内的明确字号。');return;}if(/全文|全部/.test(text)&&draftScope!=='document'){err('你的需求提到了全文，但范围控件不是“全文”。请先统一两处范围。');return;}if(/所有|同类/.test(text)&&!['same_kind','document'].includes(draftScope)){err('你的需求提到了所有同类内容，请将范围改为“所有同类内容”后再检查。');return;}const selected=anchors.find(a=>a.id===selection.id);if(/一级标题/.test(text)&&selected.role!=='heading1'||/二级标题/.test(text)&&selected.role!=='heading2'||/正文/.test(text)&&selected.role!=='body'){err('需求中的对象与当前选区不一致，请重新选择相应内容。');return;}
const property=alignmentMatches.length?'align':sizes?'size':'bold',value=property==='align'?alignmentMatches[0][1]:property==='size'?Number(sizes[1]):true;const targets=draftScope==='document'?anchors:draftScope==='same_kind'?anchors.filter(a=>a.role===selected.role):[selected];const partial=selection.text!==selected.text;if(partial&&property!=='align'&&draftScope==='selection'){err('这份示例暂不演示段内字符格式。请选择“所在段落”，确认更大的作用范围后继续。');return;}const needsScope=draftScope==='selection'&&property==='align'||['same_kind','document'].includes(draftScope);const effective=draftScope==='selection'?'paragraph':draftScope;const v=version();const label=property==='align'?({left:'左对齐',center:'居中',justify:'两端对齐'})[value]:property==='size'?value+' 磅':'加粗';const changed=targets.filter(a=>v.styles[a.id][property]!==value);if(!changed.length){err('这些内容已经符合这条需求，无需创建重复版本。');return;}

document.addEventListener('focusout',e=>{const dropdown=e.target.closest('.workspace-dropdown');if(dropdown&&!dropdown.contains(e.relatedTarget))setWorkspaceOpen(false);});
document.addEventListener('change',e=>{if(e.target.matches('input[type=radio][name=alignment],input[type=radio][name=page]')){chooseDecision(e.target.name,e.target.value);return;}if(e.target.dataset.file)handleFile(e.target.dataset.file,e.target.files[0]);if(e.target.id==='version-select'){state.viewed=Number(e.target.value);selection=null;plan=null;draftText='';persist();render();}if(e.target.id==='scope-approval'){scopeApproved=e.target.checked;const b=$('[data-action="apply-plan"]');if(b)b.disabled=!scopeApproved;}if(e.target.id==='feedback-scope'){readDraft();plan=null;$('#feedback-result').innerHTML='';}});
document.addEventListener('input',e=>{if(e.target.id==='feedback-text'){draftText=e.target.value;plan=null;$('#feedback-result').innerHTML='';}});
document.addEventListener('mouseup',e=>{if(!e.target.closest('#paper'))return;const s=window.getSelection(),text=s?.toString().trim();if(!text)return;const near=n=>(n?.nodeType===1?n:n?.parentElement)?.closest('[data-anchor]');const start=near(s.anchorNode),end=near(s.focusNode);if(!start||!end||start!==end){selection=null;updateSelection();toast('请先选择同一段落中的文字，以便唯一定位。');return;}chooseSelection(start.dataset.anchor,text);});
document.addEventListener('keyup',e=>{if(e.target.matches('[data-anchor]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chooseSelection(e.target.dataset.anchor);}});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('dragging');}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-drop]')?.classList.remove('dragging');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.remove('dragging');handleFile(z.dataset.drop,e.dataTransfer.files[0]);}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(['upload','review','workspace','history','report'].includes(r)&&routeAllowed(r)&&!processing)go(r);});
const initialRoute=location.hash.slice(1);route=['upload','review','workspace','history','report'].includes(initialRoute)&&routeAllowed(initialRoute)?initialRoute:state.stage==='review'?'review':state.stage==='ready'?'workspace':'upload';render();
})();
</script>
</body>
</html>
