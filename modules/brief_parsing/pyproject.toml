[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "brief-parser"
version = "0.9.0"
description = "Evidence-backed requirement parsing for Creator's Voice and standalone use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Creator's Voice" }]
dependencies = [
  "lxml==6.1.3",
  "fastapi==0.141.1",
  "openai==3.16.2",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pdfplumber==0.11.10",
  "pydantic==2.13.5",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "pyyaml==6.0.3",
  "python-multipart==0.0.32",
  "uvicorn==0.53.0",
]

[project.scripts]
brief-parser = "brief_parser.cli.main:main"
brief-parser-eval = "brief_parser.evaluation.cli:main"
brief-parser-golden-run = "brief_parser.evaluation.golden_cli:main"
brief-parser-load = "brief_parser.evaluation.load_cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.168.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brief_parser"]

[tool.hatch.build.targets.wheel.force-include]
"domain_packs" = "brief_parser/domain_packs_data"
"evals/golden" = "brief_parser/evaluation_data/golden"
"prompts" = "brief_parser/prompts"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".tools", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.uv]
default-groups = ["dev"]
