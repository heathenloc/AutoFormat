[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "easyformat-api"
version = "0.1.0"
description = "EasyFormat workflow API and preview adapters."
requires-python = ">=3.12,<3.13"
dependencies = [
  "brief-parser==0.9.0",
  "pypdf==6.19.0",
  "jsonschema==4.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easyformat"]
